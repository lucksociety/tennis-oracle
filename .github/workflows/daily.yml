name: daily-slate
# Fetch today's/tomorrow's fixtures (ESPN public scoreboard: fixtures + scores only, no odds),
# refresh ratings with newly completed results, freeze pre-match forecasts, audit settled ones,
# and commit docs/data + forecasts so the dashboard's Simulate button always has the newest slate.
on:
  schedule:
    - cron: "17 */4 * * *"      # every 4 hours (UTC)
  workflow_dispatch:
    inputs:
      date:
        description: "Slate date YYYY-MM-DD (America/New_York). Blank = today"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: daily-slate
  cancel-in-progress: false
jobs:
  slate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Restore Sackmann CSVs and point-model grids
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/grids
          key: oracle-data-${{ hashFiles('tennis_oracle/scoring.py', 'tennis_oracle/grid.py') }}-v1
          restore-keys: oracle-data-
      - name: Install
        run: pip install -e . pytest
      - name: Tests (scoring logic)
        run: python -m pytest -q tests
      - name: Update results (ESPN scores since dataset cutoff)
        run: oracle update-data --days 5
      - name: Fetch fixtures, export ratings, freeze forecasts
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then oracle schedule --date "${{ github.event.inputs.date }}" --days 2
          else oracle schedule --days 2; fi
      - name: Verify simulator (n>=100k, seed, re-run, analytic cross-check, consistency)
        run: oracle verify --days 2 --json
      - name: Jupiter prices (POST-FREEZE comparison only; never a model input)
        continue-on-error: true   # Jupiter geo-restricts US IPs; GitHub runners may be blocked
        run: oracle markets --days 2
      - name: Post-match audit
        run: oracle audit > /dev/null
      - name: Commit
        run: |
          git config user.name "tennis-oracle-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data forecasts data/espn market_snapshots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Daily slate $(date +%F) (model $(cat models/CURRENT)) [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
