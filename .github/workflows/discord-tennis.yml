name: Discord /tennis
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Slate date YYYY-MM-DD (America/New_York)'
        required: true
      relay:
        description: 'AES-GCM encrypted interaction credentials'
        required: true
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATE: ${{ inputs.date }}
      JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Decrypt interaction
        env:
          RELAY_PAYLOAD: ${{ inputs.relay }}
          RELAY_KEY: ${{ secrets.RELAY_KEY }}
        run: node scripts/discord-relay.mjs decrypt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/grids
          key: oracle-data-${{ hashFiles('tennis_oracle/scoring.py', 'tennis_oracle/grid.py') }}-v1
          restore-keys: oracle-data-
      - name: Update permitted results
        run: oracle update-data --days 5
      - name: Run model and freeze
        run: oracle schedule --date "$DATE" --days 1 --no-export
      - name: Verify frozen simulations
        run: oracle verify --date "$DATE" --days 1
      - name: Compare prices after freeze
        continue-on-error: true
        run: oracle markets --date "$DATE" --days 1
      - name: Build Discord response from this run
        run: node scripts/discord-report.mjs
      - name: Preserve pre-game forecasts for prospective evaluation
        run: python3 scripts/model_learning.py --capture-only
      - uses: actions/upload-artifact@v4
        with:
          name: learning-${{ github.run_id }}
          path: learning/inbox.jsonl
          retention-days: 90
          if-no-files-found: error
      - name: Deliver result
        run: node scripts/discord-relay.mjs post
      - name: Report failure
        if: failure() && env.INTERACTION_TOKEN != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/discord-relay.mjs fail
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tennis-model-${{ github.run_id }}
          path: |
            out/
            data/dates/
            data/edge/
            docs/data/
            market_snapshots/
            forecasts/
          retention-days: 14
