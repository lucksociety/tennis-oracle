name: Model and command checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e . pytest
      - name: Offline model and Discord routing regressions
        run: |
          python -m pytest -q tests
          node tests/dispatch.test.mjs
          node worker/build.mjs
      - name: Prospective evaluation regressions
        run: python3 -m unittest discover -s scripts -p test_model_learning.py
      - name: Evergreen data and reconciliation regressions
        run: python3 -m unittest discover -s scripts -p test_evergreen.py
