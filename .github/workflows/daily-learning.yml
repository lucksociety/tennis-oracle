name: Daily model learning
on:
  schedule:
    - cron: '43 11 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/model_learning.py
      - scripts/test_model_learning.py
      - learning/config.json
      - .github/workflows/daily-learning.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: daily-model-learning
  cancel-in-progress: false
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prospective evaluation and leakage guards
        run: python -m unittest discover -s scripts -p test_model_learning.py
      - name: Import archived forecasts, grade finals and evaluate calibration candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/model_learning.py --collect
      - name: Save permanent evaluation record
        run: |
          git config user.name "model-learning-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A learning
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "learning: daily prospective evaluation"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: daily-model-learning-${{ github.run_id }}
          path: learning/
          retention-days: 90
